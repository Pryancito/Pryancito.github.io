# Eclipse OS — cabeceras para la página «En vivo» (/live/ y /en/live/).
#
# El emulador (QEMU compilado a WebAssembly) usa hilos, y un navegador solo da
# SharedArrayBuffer a una página aislada entre orígenes: COOP same-origin y COEP.
# COEP es «credentialless» y no «require-corp» para que sigan cargando las
# fuentes de Google Fonts que pide css/style.css.
#
# Va dentro del bloque `server { ... }` de eclipse-os.dev, por ejemplo con
#   include /etc/nginx/snippets/eclipse-live.conf;
# y luego: sudo nginx -t && sudo systemctl reload nginx

location ~ ^/(en/)?live/ {
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Los .gz ya vienen comprimidos y la página los descomprime ella misma;
    # el .wasm y el .js del emulador se comprimen al vuelo (12 MB -> 3 MB).
    gzip on;
    gzip_types application/wasm application/javascript text/javascript application/json text/css;
    gzip_min_length 1024;

    location ~ /live/emu/manifest\.json$ {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    try_files $uri $uri/ =404;
}

# Debian ya trae `application/wasm wasm;` en /etc/nginx/mime.types (nginx 1.21+).
# Si `curl -sI https://eclipse-os.dev/live/emu/qemu-system-riscv64.wasm` no dice
# Content-Type: application/wasm, añade dentro de `http { ... }`:
#   types { application/wasm wasm; }

# --- Subdominio live.eclipse-os.dev ------------------------------------------
# Si live/ se sirve también como raíz de su propio subdominio, ese server
# necesita las mismas cabeceras en TODAS sus rutas (live.js, vendor/, emu/):
#
# server {
#     server_name live.eclipse-os.dev;
#     root /ruta/a/la/web/live;
#     index index.html;
#     add_header Cross-Origin-Opener-Policy "same-origin" always;
#     add_header Cross-Origin-Embedder-Policy "credentialless" always;
#     add_header Cross-Origin-Resource-Policy "same-origin" always;
#     gzip on;
#     gzip_types application/wasm application/javascript text/javascript application/json text/css;
#     location / { try_files $uri $uri/ =404; }
#     # ... listen 443 ssl y certificados, como el resto de eclipse-os.dev
# }
