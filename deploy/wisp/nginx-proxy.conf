# Eclipse OS — el WebSocket de Wisp, detrás de nginx. Se copia a
#   /etc/nginx/snippets/eclipse-wisp-proxy.conf
# y se incluye desde deploy/nginx-live.conf (location /live/wisp/ en
# eclipse-os.dev, location /wisp/ en live.eclipse-os.dev).
#
# Necesita la zona de nginx-http.conf (limit_conn_zone va en http { }).

# Solo páginas de eclipse-os.dev: que otra web no use este servidor como proxy.
# (Un programa fuera del navegador puede mentir en Origin; los límites de
# config.json valen igual para él.)
if ($http_origin !~ "^https://((www|live)\.)?eclipse-os\.dev$") {
    return 403;
}

# Unas pocas pestañas a la vez por IP.
limit_conn eclipse_wisp 4;

# Con la barra final, /live/wisp/ y /wisp/ llegan al servidor como «/».
proxy_pass http://127.0.0.1:5001/;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
