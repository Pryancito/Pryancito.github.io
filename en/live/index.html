<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse OS in your browser</title>
  <meta name="description" content="The real Eclipse OS kernel (riscv64) booting in your browser, on QEMU compiled to WebAssembly. It all runs on your machine.">
  <meta name="theme-color" content="#000000">
  <link rel="alternate" hreflang="es" href="https://eclipse-os.dev/live/">
  <link rel="alternate" hreflang="en" href="https://eclipse-os.dev/en/live/">

  <link rel="stylesheet" href="../../live/vendor/xterm.css">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #term { position: fixed; inset: 0; padding: 6px 4px 6px 8px; box-sizing: border-box; }
    #term .xterm { height: 100%; }
    .live-plain { color: #ddd5f7; font: 14px/1.5 ui-monospace, monospace; white-space: pre-wrap; padding: 16px !important; }
  </style>
</head>

  data-msg-download="Downloading {file}… {pct}"

  <script type="module" src="../../live/live.js?v=3"></script>

</html>
